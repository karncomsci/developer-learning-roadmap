# Fly.io config for the Go API (ADR 0005). Deployed by .github/workflows/deploy.yml
# with a pre-built image from GHCR. Secrets (DATABASE_URL, ...) are set with
# `fly secrets set`, never here.
app = "developer-roadmap-api"
primary_region = "sin"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  # Always on: every page is server-rendered through this API, so a cold start
  # would make every Visitor wait.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "10s"
    interval = "30s"
    method = "GET"
    path = "/healthz"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
